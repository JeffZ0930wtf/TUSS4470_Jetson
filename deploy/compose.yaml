# M1 container-import smoke service. Persistent bridge/core services are future
# milestones and must not be inferred from this placeholder command.
services:
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    image: tuss4470-acquisition-core:m1
    command: ["python", "-c", "import usac_protocol, usac_runtime; print('usac-core-m1:ready')"]
