[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tuss4470-acquisition"
version = "0.0.0"
description = "Cross-platform host skeleton for the TUSS4470 ultrasonic acquisition module"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.scripts]
usac-m2-smoke = "usac_runtime.m2_cli:main"
usac-m3-capture = "usac_runtime.m3_cli:main"
usac-m3-loopback = "usac_runtime.m3_loopback_cli:main"
usac-m4 = "usac_runtime.m4_cli:main"
usac-core = "usac_runtime.core_service:main"
usac-bridge = "usac_runtime.bridge_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/usac_protocol/src/usac_protocol",
  "packages/usac_runtime/src/usac_runtime",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "packages/usac_protocol/tests",
  "packages/usac_runtime/tests",
  "tests",
]
pythonpath = [
  "packages/usac_protocol/src",
  "packages/usac_runtime/src",
  ".",
]
