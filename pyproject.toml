[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tuss4470-acquisition"
version = "1.0.0"
description = "Cross-platform TUSS4470 ultrasonic acquisition and raw-data service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi<1",
  "pyserial>=3.5,<4",
  "uvicorn<1",
]

[project.scripts]
usac-core = "usac_runtime.core_server:main"
usac-bridge = "usac_runtime.bridge_cli:main"
usac-cli = "usac_runtime.client_cli:main"
usac-export = "usac_runtime.export_cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/usac_protocol/src/usac_protocol",
  "packages/usac_runtime/src/usac_runtime",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "packages/usac_protocol/tests",
  "packages/usac_runtime/tests",
  "tests",
]
pythonpath = [
  "packages/usac_protocol/src",
  "packages/usac_runtime/src",
  ".",
]
